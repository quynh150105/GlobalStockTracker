spring.datasource.url=jdbc:h2:mem:global_stock_tracker_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.signerKey=0123456789abcdef0123456789abcdef
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
alphavantage.api-key=test-api-key
app.cors.allowed-origins=http://localhost:5173
app.oauth2.success-redirect-url=http://localhost:5173/oauth2/success
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
