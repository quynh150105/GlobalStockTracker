spring.application.name=GlobalStockTracker
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

jwt.signerKey=${JWT_SIGNERKEY}
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENTID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

alphavantage.api-key=${ALPHAVANTAGE_APIKEY}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.oauth2.success-redirect-url=${APP_OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/success}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
